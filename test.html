<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Site Test</title>
<style>
body{font-family:monospace;background:#111;color:#eee;padding:20px;font-size:13px;}
h2{color:#fff;margin:16px 0 8px;}
.log{background:#1a1a1a;border:1px solid #333;padding:12px;margin-bottom:12px;border-radius:4px;min-height:40px;line-height:2;}
.ok{color:#4ade80;} .err{color:#f87171;} .warn{color:#fbbf24;} .info{color:#60a5fa;}
button{background:#BB1919;color:#fff;border:none;padding:8px 18px;font-size:13px;font-weight:700;cursor:pointer;border-radius:3px;margin:4px;}
button.sec{background:#333;}
</style>
</head>
<body>
<h1 style="color:#fff">🔬 Update Bicholim — Live Render Test</h1>

<h2>Step 1 — Firebase + Weather</h2>
<button onclick="testWeather()">▶ Test Weather Now</button>
<div id="wxLog" class="log">Click button…</div>

<h2>Step 2 — Load Articles into THIS page</h2>
<button onclick="testArticles()">▶ Load Articles</button>
<div id="artLog" class="log">Click button…</div>
<div id="artOut" style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px;"></div>

<h2>Step 3 — Check index.html CSS Variables</h2>
<button onclick="testCSS()">▶ Fetch & Test index.html CSS</button>
<div id="cssLog" class="log">Click button…</div>

<h2>Step 4 — Render index.html in iframe + grab console</h2>
<button onclick="testIframe()">▶ Load Site in iframe</button>
<div id="ifrLog" class="log">Click button…</div>
<iframe id="fr" style="width:100%;height:500px;border:2px solid #333;margin-top:8px;display:none;"></iframe>

<script type="module">
const FB = {
  apiKey:"AIzaSyCS0cxLKEV3McuFPYw6z4TP3HOjq738wo4",
  authDomain:"update-bicholim.firebaseapp.com",
  projectId:"update-bicholim",
  storageBucket:"update-bicholim.firebasestorage.app",
  messagingSenderId:"430335270267",
  appId:"1:430335270267:web:6bd9d92f267f98d10eb1de"
};

function log(id,msg,t='info'){
  const el=document.getElementById(id);
  el.innerHTML += `<div class="${t}">${new Date().toLocaleTimeString()} ${msg}</div>`;
  el.scrollTop=el.scrollHeight;
}

let _db, _fs;

async function initFB(){
  if(_db) return;
  const {initializeApp,getApps}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js');
  const app = getApps().length ? getApps()[0] : initializeApp(FB);
  const fs = await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js');
  _db = fs.getFirestore(app);
  _fs = fs;
}

// ── WEATHER TEST ─────────────────────────────────────────────────
window.testWeather = async () => {
  const L=(m,t)=>log('wxLog',m,t);
  document.getElementById('wxLog').innerHTML='';
  await initFB();
  L('Reading sitedata/main from Firestore…');
  try {
    const snap = await _fs.getDoc(_fs.doc(_db,'sitedata','main'));
    if(!snap.exists()){ L('❌ sitedata/main missing','err'); return; }
    const data = snap.data();
    const key = data.weather?.key;
    const city = data.weather?.city || 'Bicholim,IN';
    L(`✅ sitedata found. Weather key: ${key?key.substring(0,8)+'...':'NOT SET'}`, key?'ok':'err');
    L(`City: ${city}`);
    if(!key){ L('⚠️ Go to Admin → Weather → paste API key → Save','warn'); return; }

    L(`Calling OpenWeatherMap for "${city}"…`);
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${key}&units=metric`;
    const r = await fetch(url);
    const wx = await r.json();
    L(`API response code: ${wx.cod}`, wx.cod===200?'ok':'err');
    if(wx.cod===200){
      L(`✅ Temperature: ${Math.round(wx.main.temp)}°C`,'ok');
      L(`✅ Condition: ${wx.weather[0].description}`,'ok');
      L(`✅ Humidity: ${wx.main.humidity}%`,'ok');
      L(`✅ Wind: ${Math.round(wx.wind.speed*3.6)} km/h`,'ok');
      L('🎉 Weather API working perfectly!','ok');
    } else {
      L(`❌ API Error: ${wx.message}`,'err');
      if(wx.cod===401) L('→ API key invalid or not activated yet (takes 2hrs)','warn');
      if(wx.cod===404) L('→ City not found. Try "Bicholim" or "Panaji,IN"','warn');
    }
  } catch(e){ L('❌ Error: '+e.message,'err'); }
};

// ── ARTICLES TEST ─────────────────────────────────────────────────
window.testArticles = async () => {
  const L=(m,t)=>log('artLog',m,t);
  document.getElementById('artLog').innerHTML='';
  document.getElementById('artOut').innerHTML='';
  await initFB();
  L('Fetching articles from Firestore…');
  try {
    const snap = await _fs.getDocs(_fs.collection(_db,'articles'));
    L(`✅ ${snap.size} articles found`,'ok');
    const arts = snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(a=>a.status==='published')
      .sort((a,b)=>(b.date||0)-(a.date||0));
    L(`Published: ${arts.length}`,'ok');

    // Render cards directly here to test CSS works
    if(arts.length>0){
      L('Rendering first 6 cards below…','info');
      const out = document.getElementById('artOut');
      out.innerHTML = arts.slice(0,6).map(a=>`
        <div style="background:#1a1a1a;border:1px solid #333;overflow:hidden;cursor:pointer;" onclick="alert('${a.title.substring(0,40)}')">
          <div style="height:140px;overflow:hidden;background:#333;position:relative;">
            <img src="${a.image||''}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
            <span style="position:absolute;top:6px;left:6px;background:#BB1919;color:#fff;font-size:9px;font-weight:700;padding:2px 6px;">${a.category}</span>
          </div>
          <div style="padding:10px;">
            <div style="font-weight:700;font-size:13px;line-height:1.3;margin-bottom:6px;color:#fff;">${a.title.substring(0,60)}…</div>
            <div style="font-size:11px;color:#888;">${a.section} · ${a.author||'Staff'}</div>
          </div>
        </div>
      `).join('');
      L('✅ Cards rendered below — if you can see them, Firebase+data is fine','ok');
      L('→ The issue is in index.html CSS/JS, NOT in Firebase','warn');
    }
  } catch(e){ L('❌ '+e.message,'err'); }
};

// ── CSS TEST ─────────────────────────────────────────────────────
window.testCSS = async () => {
  const L=(m,t)=>log('cssLog',m,t);
  document.getElementById('cssLog').innerHTML='';
  L('Fetching index.html…');
  try {
    const r = await fetch('/index.html?'+Date.now());
    const html = await r.text();
    L(`✅ Fetched — ${Math.round(html.length/1024)}KB`,'ok');

    // Check CSS variables defined
    const vars = ['--red','--black','--white','--gray-100','--font-display','--font-ui','--charcoal'];
    L('Checking CSS variables:');
    vars.forEach(v => {
      const ok = html.includes(v);
      L(`  ${ok?'✅':'❌'} ${v}`, ok?'ok':'err');
    });

    // Check critical CSS classes
    const classes = ['.ncard-title','.ncard-exc','.ncard-meta','.ncat',
                     '.hero-grid','.hero-title','.lnews-item','.lnews-title',
                     '.news-grid','.section-header','.empty-state','.op-grid'];
    L('Checking CSS classes:');
    const missing = [];
    classes.forEach(c => {
      const ok = html.includes(c);
      if(!ok) missing.push(c);
      L(`  ${ok?'✅':'❌'} ${c}`, ok?'ok':'err');
    });

    if(missing.length===0){
      L('✅ All CSS classes present','ok');
    } else {
      L(`❌ MISSING CSS: ${missing.join(', ')}`, 'err');
      L('→ This is why articles are invisible on the page!','warn');
    }

    // Check JS functions exist
    const fns = ['function renderHero','function renderLatest','function renderMore',
                 'function renderTrend','function renderOpinion','function renderSection',
                 'function timeAgo','function loadWeather'];
    L('Checking JS functions:');
    fns.forEach(fn => {
      const ok = html.includes(fn);
      L(`  ${ok?'✅':'❌'} ${fn}()`, ok?'ok':'err');
    });

    // Check if CSS vars use --red or --red: 
    const redDef = html.match(/--red\s*:\s*([^;]+)/);
    L(`--red value: ${redDef?redDef[1].trim():'NOT FOUND'}`, redDef?'ok':'err');

    // Check font variables
    const fontUI = html.match(/--font-ui\s*:\s*([^;]+)/);
    const fontDisplay = html.match(/--font-display\s*:\s*([^;]+)/);
    L(`--font-ui: ${fontUI?fontUI[1].trim():'NOT FOUND'}`, fontUI?'ok':'err');
    L(`--font-display: ${fontDisplay?fontDisplay[1].trim():'NOT FOUND'}`, fontDisplay?'ok':'err');

  } catch(e){ L('❌ '+e.message,'err'); }
};

// ── IFRAME TEST ────────────────────────────────────────────────────
window.testIframe = () => {
  const L=(m,t)=>log('ifrLog',m,t);
  document.getElementById('ifrLog').innerHTML='';
  const fr = document.getElementById('fr');
  fr.style.display='block';
  fr.src = '/index.html?t='+Date.now();
  L('Loading index.html in iframe…','info');

  // Capture errors via window.onerror on this page (won't work cross-frame same-origin)
  fr.onload = () => {
    L('✅ iframe loaded','ok');
    try {
      const doc = fr.contentDocument;
      const win = fr.contentWindow;

      // Inject error monitor
      const sc = doc.createElement('script');
      sc.textContent = `
        var _errs = [];
        window.onerror = function(msg,src,line,col,err){
          _errs.push({msg,src:src?.split('/').pop(),line});
          window.parent.__ifrErr({msg,src:src?.split('/').pop(),line});
          return true;
        };
        window.addEventListener('unhandledrejection', function(e){
          window.parent.__ifrErr({msg:'Promise rejection: '+e.reason, src:'promise', line:0});
        });
        // After 3 seconds report DOM state
        setTimeout(function(){
          var hero = document.getElementById('heroSec');
          var latest = document.getElementById('latestGrid');
          var artCount = document.querySelectorAll('.ncard').length;
          window.parent.__ifrReport({
            heroHTML: hero ? hero.innerHTML.substring(0,300) : 'ELEMENT NOT FOUND',
            latestHTML: latest ? latest.innerHTML.substring(0,300) : 'ELEMENT NOT FOUND',
            ncardsFound: artCount,
            articlesVar: typeof articles !== 'undefined' ? articles.length : 'undefined'
          });
        }, 4000);
      `;
      doc.head.insertBefore(sc, doc.head.firstChild);

      window.__ifrErr = (e) => {
        L(`❌ JS ERROR: ${e.msg}`, 'err');
        L(`   at ${e.src} line ${e.line}`, 'err');
      };
      window.__ifrReport = (r) => {
        L(`--- DOM Report after 4s ---`,'info');
        L(`ncard elements rendered: ${r.ncardsFound}`, r.ncardsFound>0?'ok':'err');
        L(`articles variable: ${r.articlesVar}`, r.articlesVar>0?'ok':r.articlesVar===0?'warn':'err');
        L(`heroSec innerHTML (first 300): ${r.heroHTML}`, r.heroHTML.includes('hero-grid')?'ok':'err');
        L(`latestGrid innerHTML (first 300): ${r.latestHTML}`, r.latestHTML.includes('ncard')?'ok':'err');
        if(r.ncardsFound===0){
          L('❌ NO ncard elements in DOM — renderLatest() not running or failing','err');
        }
        if(r.articlesVar==='undefined'){
          L('❌ articles variable not defined — script crashed on load','err');
        }
        if(r.articlesVar===0){
          L('⚠️ articles array is empty — Firestore onSnapshot returned nothing','warn');
        }
      };
      L('✅ Monitor injected — waiting 4 seconds for Firestore to load…','ok');
    } catch(e){
      L('⚠️ Could not inject monitor: '+e.message,'warn');
      L('→ Open F12 Console on main site tab and look for red errors','warn');
    }
  };
};
</script>
</body>
</html>

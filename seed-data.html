window.clearAll=async()=>{
  if(!confirm('Delete ALL existing articles from Firestore?'))return;
  log('🗑 Clearing articles…','info');
  try{
    const snap=await getDocs(collection(db,'articles'));
    for(const d of snap.docs)await deleteDoc(d.ref);
    log(`✅ Deleted ${snap.docs.length} articles. Now click Add.`,'ok');
  }catch(e){log('❌ '+e.message,'err');}
};

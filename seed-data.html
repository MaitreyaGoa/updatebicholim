    }
    log('<span class="hd">🇮🇳 Adding India news…</span>');
    for(const a of articles.filter(a=>a.section==='India')){
      await addDoc(collection(db,'articles'),a);
      log(`✅ [India] ${a.title.substring(0,55)}…`,'ok');
    }
    log('<span class="hd">🌍 Adding International news…</span>');
    for(const a of articles.filter(a=>a.section==='International')){
      await addDoc(collection(db,'articles'),a);
      log(`✅ [Intl] ${a.title.substring(0,55)}…`,'ok');
    }
    log('<span class="hd">⚽ Adding Sports news…</span>');
    for(const a of articles.filter(a=>a.section==='Sports')){
      await addDoc(collection(db,'articles'),a);
      log(`✅ [Sports] ${a.title.substring(0,55)}…`,'ok');
    }
    log('<span class="hd">📡 Adding site data…</span>');
    await setDoc(doc(db,'sitedata','main'),siteData,{merge:true});
    log('✅ Ticker (9 items)','ok');
    log('✅ Live feed (5 items)','ok');
    log('✅ Events (6 items)','ok');
    log('✅ Classifieds (5 items)','ok');
    log('');
    log(`🎉 DONE! ${articles.length} articles added. Open your website!`,'ok');
    log('→ Go to Admin → Weather → paste your API key → Save','info');
    log('→ Delete this file after testing','info');
    btn.textContent='✅ Done! Open updatebicholim.com';
    btn.style.background='#155724';
  }catch(e){
    log('❌ Error: '+e.message,'err');
    btn.disabled=false;
    btn.textContent='🚀 Add All News Articles';
  }
};

window.clearAll=async()=>{
  if(!confirm('Delete ALL existing articles from Firestore?'))return;
  log('🗑 Clearing articles…','info');
  try{
    const snap=await getDocs(collection(db,'articles'));
    for(const d of snap.docs) await deleteDoc(d.ref);
    log(`✅ Deleted ${snap.docs.length} articles. Now click Add.`,'ok');
  }catch(e){log('❌ '+e.message,'err');}
};
</script>

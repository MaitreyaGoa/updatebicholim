window.seedAll = async () => {
  const btn = document.getElementById('seedBtn');
  btn.disabled = true; btn.textContent = '⏳ Adding…';
  document.getElementById('log').innerHTML = '';
  function log(m,t='info'){ const e=document.getElementById('log'); e.innerHTML+=`<div class="${t}">${m}</div>`; e.scrollTop=e.scrollHeight; }

  try {
    const sections = ['Goa','India','International','Sports'];
    for (const sec of sections) {
      const grp = articles.filter(a => a.section === sec);
      log(`<span class="hd">📰 ${sec} (${grp.length} articles)…</span>`);
      for (const a of grp) {
        await addDoc(collection(db,'articles'), a);
        log(`  ✅ [${a.category}] ${a.title.substring(0,60)}…`, 'ok');
      }
    }
    log('');
    log('<span class="hd">📡 Saving site data (ticker, events, classifieds, gallery)…</span>');
    await setDoc(doc(db,'sitedata','main'), siteData, {merge:true});
    log('  ✅ Ticker · Live Feed · Events · Classifieds · Gallery', 'ok');
    log('');
    log(`🎉 DONE! ${articles.length} real articles added.`, 'ok');
    log('→ Open updatebicholim.com to see articles live!', 'info');
    log('→ Admin → Weather → paste OpenWeatherMap API key → Save', 'info');
    log('→ Delete this file after testing.', 'info');
    btn.textContent = '✅ Done! Open the site';
    btn.style.background = '#155724';
  } catch(e) {
    log('❌ Error: ' + e.message, 'err');
    if (e.message.includes('permission'))
      log('→ Fix: Firebase Console → Firestore → Rules → allow read,write: if true → Publish', 'err');
    btn.disabled = false;
    btn.textContent = '🚀 Add All News Articles';
  }
};

window.clearAll = async () => {
  if (!confirm('Delete ALL existing articles? Cannot be undone.')) return;
  function log(m,t='info'){ const e=document.getElementById('log'); e.innerHTML+=`<div class="${t}">${m}</div>`; }
  log('🗑 Clearing…', 'info');
  try {
    const snap = await getDocs(collection(db,'articles'));
    for (const d of snap.docs) await deleteDoc(d.ref);
    log(`✅ Deleted ${snap.docs.length} articles. Now click Add.`, 'ok');
  } catch(e) {
    log('❌ ' + e.message, 'err');
  }
};

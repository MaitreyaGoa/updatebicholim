<!DOCTYPE html>
<html lang="en" data-dark="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Update Bicholim</title>
<meta name="description" content="Update Bicholim — Goa's Trusted Local News">
<meta property="og:site_name" content="Update Bicholim">
<meta property="og:type" content="article">
<meta id="og-title" property="og:title" content="Update Bicholim">
<meta id="og-desc" property="og:description" content="Goa's Trusted Local News">
<meta id="og-img" property="og:image" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600;700&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --red:#BB1919; --black:#0A0A0A; --charcoal:#1C1C1C; --white:#FFFFFF;
  --gray-50:#FAFAFA; --gray-100:#F0F0F0; --gray-200:#E0E0E0;
  --gray-300:#C0C0C0; --gray-500:#888; --gray-700:#444;
  --font-display:'Playfair Display',serif;
  --font-body:'Source Serif 4',serif;
  --font-ui:'IBM Plex Sans',sans-serif;
  --fu:var(--font-ui); --fd:var(--font-display);
  --g50:var(--gray-50); --g100:var(--gray-100); --g300:var(--gray-300);
  --g500:var(--gray-500); --g700:var(--gray-700);
}
[data-dark="true"] { --black:#fff; --white:#0d0d0d; --charcoal:#1a1a1a; --gray-50:#111; --gray-100:#222; --gray-200:#333; --gray-300:#555; --gray-500:#aaa; --gray-700:#ccc; }
*{margin:0;padding:0;box-sizing:border-box;}
body { background:var(--white); color:var(--black); font-family:var(--font-body); transition:background .3s,color .3s; }

/* TOP BAR */
.topbar { background:var(--black); color:#fff; padding:10px 20px; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
.topbar-brand { font-family:var(--font-display); font-size:18px; font-weight:700; color:#fff; text-decoration:none; }
.topbar-brand span { color:var(--red); }
.topbar-actions { display:flex; gap:10px; align-items:center; }
.back-btn { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,.12); color:#fff; border:none; padding:6px 14px; font-family:var(--fu); font-size:12px; font-weight:600; cursor:pointer; border-radius:2px; text-decoration:none; transition:background .15s; }
.back-btn:hover { background:rgba(255,255,255,.22); }
.dark-btn { background:none; border:1px solid rgba(255,255,255,.3); color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:14px; }

/* ARTICLE */
.article-wrap { max-width:780px; margin:0 auto; padding:32px 20px 60px; }
.art-cat { font-family:var(--fu); font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--red); margin-bottom:12px; }
.art-title { font-family:var(--fd); font-size:clamp(24px,4vw,40px); font-weight:700; line-height:1.2; margin-bottom:16px; color:var(--black); }
.art-meta { font-family:var(--fu); font-size:12px; color:var(--g500); padding-bottom:18px; border-bottom:2px solid var(--red); margin-bottom:24px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
.art-meta strong { color:var(--black); }
.art-hero { width:100%; max-height:480px; object-fit:cover; margin-bottom:28px; display:block; }
.art-body { font-size:17px; line-height:1.85; color:var(--g700); }
.art-body p { margin-bottom:18px; }

/* SHARE */
.share-box { background:var(--g50); border:1px solid var(--g100); padding:20px; margin-top:36px; border-radius:3px; }
.share-label { font-family:var(--fu); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--g500); margin-bottom:12px; }
.share-btns { display:flex; flex-wrap:wrap; gap:8px; }
.share-btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; font-family:var(--fu); font-size:12px; font-weight:700; border-radius:3px; border:none; cursor:pointer; text-decoration:none; transition:opacity .15s; }
.share-btn:hover { opacity:.85; }
.share-wa { background:#25D366; color:#fff; }
.share-fb { background:#1877F2; color:#fff; }
.share-ig { background:linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color:#fff; }
.share-li { background:#0A66C2; color:#fff; }
.share-cp { background:var(--g100); color:var(--g700); }

/* MORE NEWS */
.more-section { max-width:780px; margin:0 auto; padding:0 20px 60px; }
.more-title { font-family:var(--fd); font-size:20px; font-weight:700; margin-bottom:20px; padding-top:32px; border-top:2px solid var(--g100); }
.more-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
.more-card { cursor:pointer; border:1px solid var(--g100); transition:box-shadow .2s; }
.more-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); }
.more-card-img { height:130px; overflow:hidden; background:var(--g100); position:relative; }
.more-card-img img { width:100%; height:100%; object-fit:cover; }
.more-card-cat { position:absolute; top:6px; left:6px; background:var(--red); color:#fff; font-family:var(--fu); font-size:8px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 6px; }
.more-card-title { font-family:var(--fd); font-size:13px; font-weight:700; line-height:1.3; padding:10px 12px 6px; color:var(--black); }
.more-card-meta { font-family:var(--fu); font-size:10px; color:var(--g500); padding:0 12px 10px; }

/* LOADING */
.loading { text-align:center; padding:80px 20px; font-family:var(--fu); color:var(--g500); }
.loading-spinner { font-size:36px; animation:spin 1s linear infinite; display:block; margin-bottom:12px; }
@keyframes spin { to { transform:rotate(360deg); } }

/* FOOTER */
footer { background:var(--black); color:rgba(255,255,255,.5); text-align:center; padding:24px; font-family:var(--fu); font-size:12px; }
footer a { color:var(--red); text-decoration:none; }

@media(max-width:600px) {
  .more-grid { grid-template-columns:1fr 1fr; }
  .art-title { font-size:24px; }
  .art-body { font-size:15px; }
}
@media(max-width:400px) {
  .more-grid { grid-template-columns:1fr; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <a href="/" class="topbar-brand">UPDATE <span>BICHOLIM</span></a>
  <div class="topbar-actions">
    <a href="/" class="back-btn">← Back to Home</a>
    <button class="dark-btn" onclick="toggleDark()">🌙</button>
  </div>
</div>

<!-- ARTICLE CONTENT -->
<div id="artContent" class="article-wrap">
  <div class="loading"><span class="loading-spinner">⏳</span>Loading article…</div>
</div>

<!-- MORE FROM US -->
<div class="more-section">
  <div id="moreGrid"></div>
</div>

<footer>
  <p>© 2026 <a href="/">Update Bicholim</a> · Goa's Trusted Local News · <a href="/admin/">Admin</a></p>
</footer>

<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import{getFirestore,doc,getDoc,getDocs,collection,query,orderBy,limit}from'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const FB={
  apiKey:"AIzaSyCS0cxLKEV3McuFPYw6z4TP3HOjq738wo4",
  authDomain:"update-bicholim.firebaseapp.com",
  projectId:"update-bicholim",
  storageBucket:"update-bicholim.firebasestorage.app",
  messagingSenderId:"430335270267",
  appId:"1:430335270267:web:6bd9d92f267f98d10eb1de"
};
const app=initializeApp(FB);
const db=getFirestore(app);

// Get article ID from URL
const params=new URLSearchParams(location.search);
const artId=params.get('id');

if(!artId){
  document.getElementById('artContent').innerHTML='<div class="loading">No article specified. <a href="/">Go Home</a></div>';
} else {
  loadArticle(artId);
}

async function loadArticle(id){
  try {
    const snap=await getDoc(doc(db,'articles',id));
    if(!snap.exists()){
      document.getElementById('artContent').innerHTML='<div class="loading">Article not found. <a href="/">Go Home</a></div>';
      return;
    }
    const a={id:snap.id,...snap.data()};
    renderArticle(a);
    loadMore(a.category, a.id);
  } catch(e){
    document.getElementById('artContent').innerHTML=`<div class="loading">Error: ${e.message}</div>`;
  }
}

function timeAgo(ts){
  const d=Date.now()-ts, m=60000, h=3600000, dy=86400000;
  if(d<m) return 'Just now';
  if(d<h) return Math.floor(d/m)+'m ago';
  if(d<dy) return Math.floor(d/h)+'h ago';
  return Math.floor(d/dy)+'d ago';
}

function renderArticle(a){
  const artUrl=`https://www.updatebicholim.com/article.html?id=${a.id}`;
  const waUrl=`https://wa.me/?text=${encodeURIComponent(a.title+' | Update Bicholim\n'+artUrl)}`;
  const fbUrl=`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(artUrl)}`;
  const liUrl=`https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(artUrl)}`;

  // Update page title and OG tags
  document.title=`${a.title} | Update Bicholim`;
  document.getElementById('og-title').content=a.title;
  document.getElementById('og-desc').content=a.excerpt||'';
  document.getElementById('og-img').content=a.image||'';

  // Format body
  const body=(a.body||a.excerpt||'')
    .replace(/\n\n/g,'</p><p>')
    .replace(/\n/g,'<br>');

  document.getElementById('artContent').innerHTML=`
    ${a.image?`<img class="art-hero" src="${a.image}" alt="${a.title}" onerror="this.style.display='none'">`:''}
    <div class="art-cat">${a.section||a.category} · ${a.category}</div>
    <h1 class="art-title">${a.title}</h1>
    <div class="art-meta">
      <span>By <strong>${a.author||'Staff Reporter'}</strong></span>
      <span>·</span>
      <span>${new Date(a.date).toLocaleDateString('en-IN',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</span>
      ${a.location?`<span>·</span><span>📍 ${a.location}</span>`:''}
      <span>·</span>
      <span>${timeAgo(a.date)}</span>
    </div>
    <div class="art-body"><p>${body}</p></div>
    <div class="share-box">
      <div class="share-label">📤 Share this story</div>
      <div class="share-btns">
        <a href="${waUrl}" target="_blank" rel="noopener" class="share-btn share-wa">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
          WhatsApp
        </a>
        <a href="${fbUrl}" target="_blank" rel="noopener" class="share-btn share-fb">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
          Facebook
        </a>
        <button onclick="igShare('${artUrl}')" class="share-btn share-ig">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/></svg>
          Instagram
        </button>
        <a href="${liUrl}" target="_blank" rel="noopener" class="share-btn share-li">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width:14px;height:14px"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
          LinkedIn
        </a>
        <button onclick="cpLink('${artUrl}',this)" class="share-btn share-cp">🔗 Copy Link</button>
      </div>
    </div>
  `;
}

async function loadMore(category, currentId){
  try {
    const snap=await getDocs(query(collection(db,'articles'),orderBy('date','desc'),limit(10)));
    const arts=snap.docs.map(d=>({id:d.id,...d.data()}))
      .filter(a=>a.status==='published' && a.id!==currentId)
      .slice(0,3);
    if(!arts.length) return;
    document.getElementById('moreGrid').innerHTML=`
      <div class="more-title">More from Update Bicholim</div>
      <div class="more-grid">
        ${arts.map(a=>`
          <div class="more-card" onclick="window.location.href='article.html?id=${a.id}'">
            <div class="more-card-img">
              ${a.image?`<img src="${a.image}" alt="${a.title}" onerror="this.style.display='none'">`:'' }
              <span class="more-card-cat">${a.category}</span>
            </div>
            <div class="more-card-title">${a.title}</div>
            <div class="more-card-meta">${new Date(a.date).toLocaleDateString('en-IN')}</div>
          </div>`).join('')}
      </div>`;
  } catch(e){ console.log('More articles error:',e); }
}

window.toggleDark=()=>{
  const d=document.documentElement.getAttribute('data-dark')==='true';
  document.documentElement.setAttribute('data-dark',String(!d));
  document.querySelector('.dark-btn').textContent=d?'🌙':'☀️';
};
window.cpLink=(url,btn)=>{
  navigator.clipboard.writeText(url).then(()=>{
    btn.textContent='✅ Copied!';
    setTimeout(()=>btn.textContent='🔗 Copy Link',2500);
  });
};
window.igShare=(url)=>{
  navigator.clipboard.writeText(url).then(()=>{
    alert('Link copied! Paste it in your Instagram story or bio.');
    window.open('https://www.instagram.com/','_blank');
  });
};
</script>
</body>
</html>
